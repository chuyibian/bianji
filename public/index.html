<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="便记">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<title>便记</title>
</head>
<body>

<!-- 首页 -->
<section id="home" class="view">
  <nav class="navbar">
    <a href="#/calendar" class="nav-icon" aria-label="日历">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    </a>
    <a href="#/data" class="nav-icon" aria-label="数据">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 20v-6M12 20V5.5M19 20v-9.5"/></svg>
    </a>
  </nav>
  <div class="card tile">
    <span class="tile-head">
      <span class="tile-label">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="10" r="7.5"/><path d="M10 5.5V10l3 2"/></svg>
        距上一次
      </span>
      <span id="lastAt" class="tile-meta"></span>
    </span>
    <span id="sinceValue" class="metric"></span>
  </div>

  <div class="record-wrap">
    <button id="record" class="record" aria-label="记录一次">
      <img src="icons/cat.svg" alt="" draggable="false">
      <span id="recordLabel">记录</span>
    </button>
  </div>
</section>

<!-- 日历 -->
<section id="calendar" class="view" hidden>
  <nav class="navbar">
    <a href="#/" class="nav-back"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>便记</a>
    <button id="todayBtn" class="nav-btn">今天</button>
  </nav>
  <header class="large-title title-row">
    <div>
      <h1 id="monthLabel"></h1>
      <p id="monthCount" class="subtitle"></p>
    </div>
    <div class="stepper">
      <button id="prevMonth" aria-label="上个月"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg></button>
      <button id="nextMonth" aria-label="下个月"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m2 2 8 8-8 8"/></svg></button>
    </div>
  </header>
  <div class="card cal">
    <div class="weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div id="grid" class="grid"></div>
  </div>
  <div class="section-head">
    <span id="dayLabel"></span>
    <button id="addBtn" class="link"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 2.5v11M2.5 8h11"/></svg>补录</button>
  </div>
  <ul id="dayList" class="card group"></ul>
</section>

<!-- 数据 -->
<section id="data" class="view" hidden>
  <nav class="navbar">
    <a href="#/" class="nav-back"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>便记</a>
  </nav>
  <header class="large-title"><h1>数据</h1></header>

  <div id="range" class="segmented">
    <button data-r="7">7天</button><button data-r="30">30天</button><button data-r="12m">12个月</button>
  </div>

  <div class="card"><div id="trendHead" class="chart-head"></div><div id="trend"></div></div>
  <ul id="summary" class="card group"></ul>
  <div class="card"><div id="hoursHead" class="chart-head"></div><div id="hours"></div></div>
  <div class="card"><div id="shapeHead" class="chart-head"></div><div id="shapeBody"></div></div>
  <div class="card"><div id="feelHead" class="chart-head"></div><div id="feelBody"></div></div>
  <p class="footnote">统计仅供参考，不构成医疗建议。如有持续异常请就医。</p>

  <div class="section-head"><span>数据备份</span></div>
  <ul class="card group">
    <li><button id="exportBtn" class="row link-row">导出备份</button></li>
    <li><button id="importBtn" class="row link-row">导入备份</button></li>
  </ul>
  <p class="footnote">数据只保存在这台手机的浏览器里。建议每月导出一次，换手机或清理 Safari 数据前务必导出。</p>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
</section>

<!-- 记录详情 -->
<div id="sheet" class="sheet" hidden>
  <div class="backdrop"></div>
  <form id="sheetForm" class="panel">
    <div class="grabber"></div>
    <div class="sheet-nav">
      <button type="button" id="sheetLeft" class="nav-btn"></button>
      <h2 id="sheetTitle"></h2>
      <button type="submit" id="doneBtn" class="nav-btn strong">完成</button>
    </div>
    <h3 class="sheet-title">时间</h3>
    <div class="tiles"><label class="time-tile"><input type="time" id="timeInput" required aria-label="时间"></label></div>
    <h3 class="sheet-title">形状<small>布里斯托分类</small></h3>
    <div id="bristolPick" class="tiles"></div>
    <h3 class="sheet-title">体感</h3>
    <div id="feelingPick" class="tiles"></div>
  </form>
</div>

<script src="app.js"></script>
</body>
</html>
